# Pin to full commit SHAs in a production environment
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel outdated in-progress runs for pull requests and branch pushes
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ========================================================
  # Job: Backend Linting and Formatting Check
  # Validates Python code style and import order using Ruff
  # ========================================================
  backend-lint:
    name: Backend Lint (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Check code formatting
        run: ruff format --check backend

      - name: Run Ruff linter
        run: ruff check backend

  # ========================================================
  # Job: Backend Unit & Integration Tests Matrix
  # Executes pytest across supported Python runtimes (3.11 & 3.12)
  # Enforces a minimum 85% code coverage threshold
  # ========================================================
  backend-test:
    name: Backend Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Pytest with 85% coverage threshold
        working-directory: backend
        run: |
          pytest --cov=app --cov-report=xml:coverage.xml --cov-report=term-missing --cov-fail-under=85 tests/

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-python-${{ matrix.python-version }}
          path: backend/coverage.xml
          retention-days: 7

      - name: Write coverage summary to Step Summary
        if: always()
        run: |
          echo "### 🧪 Python ${{ matrix.python-version }} Test & Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Coverage Threshold:** 85%" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** \`backend-coverage-python-${{ matrix.python-version }}\` uploaded" >> $GITHUB_STEP_SUMMARY

  # ========================================================
  # Job: Frontend Lint, Typecheck, Test, and Build
  # Verifies React components, compiles TypeScript, and runs Vitest
  # ========================================================
  frontend-checks:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: TypeScript typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run Vitest with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Build frontend bundle
        working-directory: frontend
        env:
          VITE_APP_VERSION: "1.0.0-ci"
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_BUILD_TIME: ${{ github.event.head_commit.timestamp || '2026-11-04T00:00:00Z' }}
        run: npm run build

      - name: Upload compiled dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ========================================================
  # Job: GitHub Actions Workflow Linting
  # Runs actionlint to catch YAML and expression bugs in workflows
  # ========================================================
  workflow-lint:
    name: Workflow Lint (Actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run actionlint
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  # ========================================================
  # Job: CI Success Gate
  # Aggregates all upstream check results for branch protection rules
  # ========================================================
  ci-success:
    name: ci-success
    needs: [backend-lint, backend-test, frontend-checks, workflow-lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all upstream check statuses
        run: |
          echo "Evaluating CI pipeline status..."
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || \
             [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "❌ One or more required upstream checks failed or were cancelled."
            exit 1
          fi
          echo "✅ All required CI jobs passed successfully!"
          echo "### 🚀 CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend Lint:** Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend Tests (3.11 & 3.12):** Passed (≥85% coverage)" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend Quality & Build:** Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow Lint (Actionlint):** Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Gate Status:** Complete" >> $GITHUB_STEP_SUMMARY
