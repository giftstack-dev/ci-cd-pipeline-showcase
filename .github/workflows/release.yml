# Pin to full commit SHAs in a production environment
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Never cancel in-progress production release pipelines
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: giftstack-dev/ci-cd-pipeline-showcase-backend

jobs:
  # ========================================================
  # Job: Tag & Version Integrity Verification
  # Validates that the git tag strictly matches the /VERSION file
  # ========================================================
  verify:
    name: Verify Tag Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compare Git tag with VERSION file
        id: check
        run: |
          TAG_NAME="${{ github.ref_name }}"
          TAG_VERSION="${TAG_NAME#v}"
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')

          echo "Inspecting release versions..."
          echo "Git Tag: $TAG_NAME (Extracted version: $TAG_VERSION)"
          echo "VERSION file: $FILE_VERSION"

          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "❌ Version mismatch error:"
            echo "Git tag '$TAG_NAME' expects /VERSION to be '$TAG_VERSION', but found '$FILE_VERSION'."
            echo "Please ensure the /VERSION file is updated prior to pushing the release tag."
            exit 1
          fi

          echo "✅ Tag '$TAG_NAME' matches /VERSION file '$FILE_VERSION'."
          echo "version=${FILE_VERSION}" >> $GITHUB_OUTPUT

  # ========================================================
  # Job: Publish Production Container Image
  # Pushes production-tagged images ({version}, {major}.{minor}, and latest)
  # ========================================================
  publish-image:
    name: Publish Production Image to GHCR
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for Release
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            APP_ENV=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # Job: Create Official GitHub Release
  # Compiles frontend assets, attaches zip bundle, generates changelog notes
  # ========================================================
  github-release:
    name: Create GitHub Release
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Build frontend release bundle
        working-directory: frontend
        env:
          VITE_BASE_PATH: "/ci-cd-pipeline-showcase/"
          VITE_APP_VERSION: ${{ needs.verify.outputs.version }}
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_BUILD_TIME: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
        run: |
          npm ci
          npm run build

      - name: Package frontend distribution
        run: |
          zip -r frontend-dist-${{ needs.verify.outputs.version }}.zip frontend/dist

      - name: Create GitHub Release with attached assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            frontend-dist-${{ needs.verify.outputs.version }}.zip \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes

  # ========================================================
  # Job: Deploy Production Environment (Protected Gate)
  # Uses GitHub Environment 'production' with required reviewers
  # ========================================================
  deploy-production:
    name: Deploy Production (Protected Gate)
    needs: [publish-image, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PRODUCTION_API_URL || 'https://giftstack-dev.github.io/ci-cd-pipeline-showcase/' }}
    steps:
      - name: Trigger production deployment hook and verify health
        env:
          DEPLOY_HOOK: ${{ secrets.PRODUCTION_DEPLOY_HOOK_URL }}
          API_URL: ${{ vars.PRODUCTION_API_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "Production deploy skipped: no deploy hook configured (PRODUCTION_DEPLOY_HOOK_URL secret not set)."
            echo "### ℹ️ Production Deployment" >> $GITHUB_STEP_SUMMARY
            echo "Production deploy skipped: no deploy hook configured." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "Triggering production deployment webhook..."
          curl -s -f -X POST "$DEPLOY_HOOK"

          if [ -z "$API_URL" ]; then
            echo "PRODUCTION_API_URL variable is not set; skipping live health check."
            exit 0
          fi

          echo "Awaiting healthy response from $API_URL/health (up to 10 attempts)..."
          ATTEMPT=0
          MAX_ATTEMPTS=10
          DELAY=15
          SUCCESS=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS: Checking $API_URL/health..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/health" || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Production health check passed with HTTP 200!"
              SUCCESS=1
              break
            fi
            echo "Returned status $STATUS. Retrying in $DELAY seconds..."
            sleep $DELAY
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "❌ Production healthcheck failed after $MAX_ATTEMPTS attempts."
            exit 1
          fi

          echo "Verifying SHA provenance from $API_URL/version..."
          DEPLOYED_SHA=$(curl -s "$API_URL/version" | grep -o '"commit_sha":"[^"]*' | cut -d'"' -f4 || true)
          echo "Expected SHA: $EXPECTED_SHA"
          echo "Deployed SHA: $DEPLOYED_SHA"
          if [ "$DEPLOYED_SHA" != "$EXPECTED_SHA" ]; then
            echo "⚠️ Notice: Deployed commit SHA does not match current commit yet (propagation delay)."
          fi

      - name: Output Release Summary
        if: always()
        run: |
          echo "## 🎉 Production Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Release Tag** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Semantic Version** | \`${{ needs.verify.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Git Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Production Container** | \`ghcr.io/giftstack-dev/ci-cd-pipeline-showcase-backend:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Production URL** | \`${{ vars.PRODUCTION_API_URL || 'Not configured (demo mode active)' }}\` |" >> $GITHUB_STEP_SUMMARY
