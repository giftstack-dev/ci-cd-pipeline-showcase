services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        VERSION: "1.0.0-compose"
        COMMIT_SHA: "local-compose"
        BUILD_TIME: "2026-11-04T00:00:00Z"
        APP_ENV: "local-docker"
    container_name: pipeline-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local-docker
      - ALLOWED_ORIGINS=http://localhost:8080,http://localhost:5173,http://localhost:3000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:8000"
        VITE_BASE_PATH: "/"
        VITE_APP_VERSION: "1.0.0"
        VITE_COMMIT_SHA: "compose"
        VITE_BUILD_TIME: "2026-11-04T00:00:00Z"
    container_name: pipeline-frontend
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
